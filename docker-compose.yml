services:
  ajuste-de-ponto:
    build:
      context: .
      dockerfile: Dockerfile
    image: ajuste-de-ponto:latest
    container_name: agente-ajuste-de-ponto
    ports:
      - "${PORT:-8080}:8080"
    environment:
      - PORT=8080
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - GOOGLE_API_KEY=${GOOGLE_API_KEY:-}
      - MODEL_NAME=${MODEL_NAME:-gemini-2.5-flash}
    env_file:
      - path: .env
        required: false
    restart: unless-stopped
